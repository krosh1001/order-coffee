<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Заказ кофе</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form>
      <div class="beverages-container">
        <fieldset class="beverage" id="beverage-1">
          <button type="button" class="remove-button">X</button>
          <h4 class="beverage-count">Напиток №1</h4>
          
          <label class="field">
            <span class="label-text">Я буду</span>
            <select>
              <option value="espresso">Эспрессо</option>
              <option value="capuccino" selected>Капучино</option>
              <option value="cacao">Какао</option>
            </select>
          </label>

          <div class="field">
            <span class="checkbox-label">Сделайте напиток на</span>
            <label class="checkbox-field">
              <input type="radio" name="milk-1" value="usual" checked />
              <span>обычном молоке</span>
            </label>
            <label class="checkbox-field">
              <input type="radio" name="milk-1" value="no-fat" />
              <span>обезжиренном молоке</span>
            </label>
            <label class="checkbox-field">
              <input type="radio" name="milk-1" value="soy" />
              <span>соевом молоке</span>
            </label>
            <label class="checkbox-field">
              <input type="radio" name="milk-1" value="coconut" />
              <span>кокосовом молоке</span>
            </label>
          </div>

          <div class="field">
            <span class="checkbox-label">Добавьте к напитку:</span>
            <label class="checkbox-field">
              <input type="checkbox" name="options-1" value="whipped cream" />
              <span>взбитых сливок</span>
            </label>
            <label class="checkbox-field">
              <input type="checkbox" name="options-1" value="marshmallow" />
              <span>зефирок</span>
            </label>
            <label class="checkbox-field">
              <input type="checkbox" name="options-1" value="chocolate" />
              <span>шоколад</span>
            </label>
            <label class="checkbox-field">
              <input type="checkbox" name="options-1" value="cinnamon" />
              <span>корицу</span>
            </label>
          </div>

          <div class="field">
            <label class="field">
              <span class="label-text">И еще вот что</span>
              <textarea class="wish-input" rows="3" style="width: 100%; margin-top: 5px;"></textarea>
            </label>
            <div class="wish-output" style="margin-top: 5px; font-style: italic; min-height: 1.2em;"></div>
          </div>
        </fieldset>
      </div>
      
      <div>
        <button type="button" class="add-button">+ Добавить напиток</button>
      </div>
      <div style="margin-top: 30px">
        <button type="submit" class="submit-button">Готово</button>
      </div>
    </form>

    <div class="modal-overlay hidden">
        <div class="modal">
            <button class="modal-close">&times;</button>
            <h2>Заказ принят!</h2>
            <p class="modal-text"></p>
            
            <table class="modal-table">
                <thead>
                    <tr>
                        <th>Напиток</th>
                        <th>Молоко</th>
                        <th>Дополнительно</th>
                        <th>Пожелания</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <div class="order-time-container" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                <label>
                    Выберите время заказа:
                    <input type="time" class="order-time" required style="margin-left: 10px;">
                </label>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button type="button" class="checkout-button submit-button">Оформить</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
